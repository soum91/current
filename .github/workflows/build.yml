name: Build Current IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build for iPhone
        run: |
          set -o pipefail
          xcodebuild \
            -project Current.xcodeproj \
            -scheme Current \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build 2>&1 | tee build.log
          test -d build/Build/Products/Release-iphoneos/Current.app
          test -d build/Build/Products/Release-iphoneos/Current.app/PlugIns/CurrentWidget.appex

      - name: Package unsigned IPA
        id: ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Current.app Payload/
          APP=Payload/Current.app
          WIDGET="$APP/PlugIns/CurrentWidget.appex"
          BUILD=${{ github.run_number }}
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$WIDGET/Info.plist"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          # Match the Obsidian sideload release convention: 1.0.0.<build>.
          # Both app and extension must advertise the same version as the source.
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION.$BUILD" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION.$BUILD" "$WIDGET/Info.plist"
          codesign --force --sign - --timestamp=none --entitlements CurrentWidget/CurrentWidget.entitlements "$WIDGET"
          codesign --force --sign - --timestamp=none --entitlements Current/Current.entitlements "$APP"
          IPA="Current-$VERSION-build-$BUILD.ipa"
          zip -qr "$IPA" Payload
          echo "ipa=$IPA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "display_version=$VERSION.$BUILD" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Current-build-${{ github.run_number }}
          path: ${{ steps.ipa.outputs.ipa }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Current ${{ steps.ipa.outputs.display_version }}
          make_latest: true
          body: |
            iOS 18+ SwiftUI network throughput monitor with a Dynamic Island Live Activity.

            This is an ad-hoc signed IPA for sideloading. Keep the CurrentWidget extension enabled when signing.

            **Important:** iOS limits updates to Live Activities after the app is suspended. Current marks stale readings as paused; it cannot promise permanent second-by-second speeds over other apps.
          files: ${{ steps.ipa.outputs.ipa }}

      - name: Refresh AltStore and FlareStore source
        env:
          IPA: ${{ steps.ipa.outputs.ipa }}
          VERSION: ${{ steps.ipa.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 scripts/update_source.py "$IPA" "$VERSION" "$BUILD_NUMBER"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json
          if ! git diff --cached --quiet; then
            git commit -m "Update app source for build $BUILD_NUMBER [skip ci]"
            git push origin HEAD:main
          fi
